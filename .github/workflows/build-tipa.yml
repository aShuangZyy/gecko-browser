name: Build Gecko TIPA

# 编译 Reynard 的 Gecko 引擎 + app，输出可被 TrollStore 安装的 .tipa。
# 触发：手动（workflow_dispatch）或 push 到 main 且改动相关目录 / tag。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支或 tag（默认 main）"
        required: false
        default: "main"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/build-tipa.yml"
      - "browser/**"
      - "patches/**"
      - "tools/**"

concurrency:
  group: gecko-tipa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: macos-26 / Xcode 26.6 / arm64
    runs-on: macos-26
    timeout-minutes: 360

    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # Gecko 交叉编译目标
      GECKO_TARGET: aarch64-apple-ios
      GECKO_MIN_IOS: "13.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid cbindgen llvm sccache python@3.12
          echo "LLVM_PREFIX=$(brew --prefix llvm)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # 注意：不要缓存 engine/obj-aarch64-apple-ios（几十 GB，会撑爆 GitHub 10GB 限制）。
      - name: Cache toolchain caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
          key: gecko-${{ runner.os }}-${{ hashFiles('patches/**', 'tools/**') }}
          restore-keys: |
            gecko-${{ runner.os }}-

      - name: Sync Gecko sources
        run: ./tools/development/update-gecko.sh

      - name: Apply iOS patches
        run: ./tools/development/apply-patches.sh

      - name: Build idevice FFI
        run: ./tools/development/build-idevice.sh

      - name: Build Gecko
        run: ./tools/development/build-gecko.sh --use-sccache --auto-clobber

      - name: Prepare xcconfig
        run: |
          mkdir -p dist
          if [ -f browser/Configuration/Reynard.xcconfig ]; then
            cp browser/Configuration/Reynard.xcconfig dist/Reynard.xcconfig
          fi
          echo "CURRENT_BUILD=$(git rev-parse --short HEAD)" >> dist/Reynard.xcconfig

      - name: Build app (unsigned)
        run: ./tools/development/build-app.sh --no-signing

      - name: Package TrollStore TIPA
        run: ./tools/development/create-ipa.sh --trollstore

      - name: Show artifacts
        run: ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeckoBrowser-TrollStore
          path: dist/*.tipa
          if-no-files-found: error
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tipa
          generate_release_notes: true
